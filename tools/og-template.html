<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <title>サ印帳 OGP</title>
    <style>
      :root {
        --paper: #fffaf2;
        --ink: #111817;
        --line: rgba(255, 250, 242, 0.2);
        --primary: #007a70;
        --accent: #c93a2b;
        --gold: #f1c64b;
        --night: #0b1514;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        display: grid;
        place-items: center;
        width: 1200px;
        height: 630px;
        margin: 0;
        color: var(--paper);
        background: var(--night);
        font-family: "Noto Sans JP", sans-serif;
      }

      .card {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 330px;
        gap: 44px;
        width: 1120px;
        height: 550px;
        padding: 58px 62px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(5, 9, 9, 0.94), rgba(5, 9, 9, 0.66) 58%, rgba(5, 9, 9, 0.42)),
          url("../assets/saincho-header-ritual.webp") center / cover no-repeat;
        border: 3px solid var(--line);
        border-radius: 30px;
        box-shadow: 0 32px 84px rgba(0, 0, 0, 0.34);
      }

      .card::before {
        position: absolute;
        inset: 34px;
        pointer-events: none;
        border: 2px solid rgba(255, 250, 242, 0.18);
        border-radius: 20px;
        content: "";
      }

      .copy {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--gold);
        font-family: "Inter", sans-serif;
        font-size: 28px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        color: var(--paper);
        font-size: 94px;
        font-weight: 900;
        line-height: 1.02;
        text-shadow: 0 16px 38px rgba(0, 0, 0, 0.5);
      }

      .lead {
        max-width: 650px;
        margin: 26px 0 0;
        color: rgba(255, 250, 242, 0.9);
        font-size: 31px;
        font-weight: 900;
        line-height: 1.55;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 38px;
      }

      .chips span {
        padding: 10px 18px;
        color: var(--paper);
        background: rgba(255, 250, 242, 0.12);
        border: 2px solid rgba(255, 250, 242, 0.2);
        border-radius: 999px;
        font-size: 21px;
        font-weight: 900;
      }

      .visual {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
      }

      .stamp {
        position: relative;
        display: grid;
        place-items: center;
        width: 304px;
        height: 304px;
        color: var(--accent);
        background: rgba(255, 250, 242, 0.95);
        border: 16px solid currentColor;
        border-radius: 50%;
        transform: rotate(-8deg);
        box-shadow: 0 22px 56px rgba(0, 0, 0, 0.32);
      }

      .stamp::before {
        position: absolute;
        inset: 27px;
        border: 5px dashed var(--accent);
        border-radius: 50%;
        content: "";
        opacity: 0.62;
      }

      .stamp::after {
        position: absolute;
        bottom: 58px;
        left: 55px;
        width: 170px;
        height: 42px;
        border-bottom: 18px solid var(--accent);
        border-radius: 0 0 999px 999px;
        content: "";
      }

      .stamp strong {
        font-size: 126px;
        font-weight: 900;
      }

      .note {
        margin-top: 36px;
        color: var(--gold);
        font-size: 25px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="copy">
        <p class="eyebrow">SAUNA STAMP RALLY</p>
        <h1>サ印帳</h1>
        <p class="lead">全国5,000超のサウナを探して、行った一湯を赤印で記録。</p>
        <div class="chips" aria-label="主な機能">
          <span>サウナ検索</span>
          <span>施設詳細</span>
          <span>サ飯</span>
          <span>称号</span>
        </div>
      </section>
      <section class="visual" aria-hidden="true">
        <div class="stamp"><strong>熱</strong></div>
        <div class="note">押して集める、次の一湯。</div>
      </section>
    </main>
  </body>
</html>
