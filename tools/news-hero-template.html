<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>サウニュ〜 タイトルカード</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    background: #f3f1ea;
    color: #111817;
    overflow: hidden;
  }
  .frame {
    position: absolute; inset: 0;
    border: 10px solid #111817;
    padding: 56px 64px 48px;
    display: flex; flex-direction: column;
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; }
  .masthead { display: flex; align-items: center; gap: 16px; }
  .stamp {
    width: 54px; height: 54px; border-radius: 10px;
    background: #b73528; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900;
  }
  .masthead-name { font-size: 34px; font-weight: 900; letter-spacing: 0.04em; }
  .site-name { font-size: 22px; font-weight: 700; color: #596763; }
  .chip {
    display: inline-flex; align-items: center;
    margin-top: 44px; padding: 8px 18px; border-radius: 999px;
    color: #fff; font-size: 24px; font-weight: 800; letter-spacing: 0.06em;
    align-self: flex-start;
  }
  .title {
    margin-top: 30px;
    font-weight: 900; line-height: 1.32; letter-spacing: 0.01em;
    font-size: 62px;
  }
  .bottom-row {
    margin-top: auto; display: flex; align-items: baseline; gap: 20px;
    border-top: 2px solid #ced9d3; padding-top: 22px;
  }
  .date { font-size: 24px; font-weight: 700; }
  .tagline { font-size: 22px; color: #596763; }
  /* サムネイル用（タイトル文字なし・カテゴリを大きく見せる） */
  body.thumb .frame { border-width: 6px; padding: 30px 34px 26px; }
  body.thumb .stamp { width: 40px; height: 40px; font-size: 22px; border-radius: 8px; }
  body.thumb .masthead-name { font-size: 26px; }
  body.thumb .site-name { font-size: 17px; }
  body.thumb .chip { display: none; }
  body.thumb .title { display: none; }
  .thumb-category { display: none; }
  body.thumb .thumb-category {
    display: block; margin-top: 40px;
    font-size: 76px; font-weight: 900; line-height: 1.25; letter-spacing: 0.02em;
  }
  body.thumb .bottom-row { padding-top: 16px; }
  body.thumb .date { font-size: 21px; }
  body.thumb .tagline { font-size: 18px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top-row">
      <div class="masthead">
        <div class="stamp">サ</div>
        <div class="masthead-name">サウニュ〜</div>
      </div>
      <div class="site-name">サ印帳</div>
    </div>
    <div class="chip" id="chip">ニュース</div>
    <h1 class="title" id="title"></h1>
    <div class="thumb-category" id="thumbCategory"></div>
    <div class="bottom-row">
      <div class="date" id="date"></div>
      <div class="tagline">サ印帳のサウナニュース</div>
    </div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("variant") === "thumb") {
    document.body.classList.add("thumb");
    document.getElementById("thumbCategory").textContent = params.get("category") || "ニュース";
  }
  const title = params.get("title") || "";
  const chip = document.getElementById("chip");
  chip.textContent = params.get("category") || "ニュース";
  chip.style.background = params.get("color") || "#006d64";
  document.getElementById("date").textContent = params.get("date") || "";
  const titleEl = document.getElementById("title");
  titleEl.textContent = title;
  // 長いタイトルは段階的に縮小して枠内に収める
  let size = 62;
  titleEl.style.fontSize = size + "px";
  while ((titleEl.scrollHeight > 330 || titleEl.scrollWidth > titleEl.clientWidth) && size > 34) {
    size -= 4;
    titleEl.style.fontSize = size + "px";
  }
  document.title = "ready";
</script>
</body>
</html>
